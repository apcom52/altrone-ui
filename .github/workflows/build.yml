name: Publish development version

on:
  push:
    branches:
      - develop

jobs:
  publish-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Compute next dev version
        id: versioning
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          BASE_VERSION=$(node -p "require('./package.json').version")

          echo "Base version: $BASE_VERSION"

          VERSIONS=$(npm view $PACKAGE_NAME versions --json | jq -r '.[]' || echo "")
          MATCHING=$(echo "$VERSIONS" | grep "^${BASE_VERSION}-dev\." || true)

          if [ -z "$MATCHING" ]; then
            NEXT_DEV=1
          else
            LAST=$(echo "$MATCHING" | sed -E 's/^.*-dev\.([0-9]+)$/\1/' | sort -n | tail -n1)
            NEXT_DEV=$((LAST + 1))
          fi

          NEXT_VERSION="${BASE_VERSION}-dev.${NEXT_DEV}"
          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # - name: Set pre-release version
      #   run: npm version ${{ steps.versioning.outputs.version }} --no-git-tag-version

