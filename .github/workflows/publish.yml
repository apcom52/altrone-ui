name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from
        required: true
        default: next
        type: string
      version:
        description: Version to publish (e.g. 4.0.0-beta.3 or 4.0.0)
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - dev
          - beta
          - rc
          - release

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Validate inputs
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi
          if [ "$TAG" = "release" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::A release publish must not use a prerelease version ('$VERSION')"
            exit 1
          fi
          if [ "$TAG" != "release" ] && [[ "$VERSION" != *-* ]]; then
            echo "::error::Tag '$TAG' requires a prerelease version (e.g. 4.0.0-$TAG.1), got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check the tag is free and remember the base commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build (pre-check)
        run: npm run build

      - name: Bump version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Build (with bumped version)
        run: npm run build

      - name: Commit version bump and tag
        id: release_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[Release]: $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "v$VERSION"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$TAG" = "release" ]; then
            npm publish --provenance --access public
          else
            npm publish --provenance --access public --tag "$TAG"
          fi

      - name: Roll back version bump and tag
        if: failure() && steps.release_push.conclusion == 'success'
        run: |
          git push --force-with-lease="refs/heads/$BRANCH:$(git rev-parse HEAD)" origin "$BASE_SHA:refs/heads/$BRANCH"
          git push origin ":refs/tags/v$VERSION"
